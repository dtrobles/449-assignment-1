<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e776d">
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <title>Planboard Mobile</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17212b;background:#f8f5ef}body{margin:0;padding:24px;max-width:520px;margin:auto}h1{margin:0}p{color:#65727e}form{display:flex;gap:8px;margin:22px 0}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}button{background:#0e776d;color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:bold}ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:10px;background:#fff;padding:14px;margin:8px 0;border-radius:10px;box-shadow:0 1px 4px #0001}li span{flex:1}small{display:block;color:#65727e}.done span{text-decoration:line-through;color:#65727e}</style>
</head>
<body>
  <h1>Today</h1><p id="date"></p>
  <form id="add"><input name="title" required placeholder="Quick add a task"><button>Add</button></form>
  <ul id="tasks"></ul>
  <script>
    const today = new Date().toISOString().slice(0,10), list = document.querySelector("#tasks");
    document.querySelector("#date").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    async function call(path, options={}) { const r=await fetch("/api"+path,{headers:{"Content-Type":"application/json"},...options}); if(!r.ok) throw new Error("Could not update task"); return r.status===204?null:r.json(); }
    async function refresh() { const tasks=await call("/tasks?date="+today); list.replaceChildren(...tasks.filter(t=>!t.completed).map(t=>{const li=document.createElement("li"), box=document.createElement("input"), text=document.createElement("span");box.type="checkbox";text.innerHTML=`${t.title}<small>${t.priority} · ${t.category}</small>`;box.onchange=async()=>{await call("/tasks/"+t.id,{method:"PATCH",body:JSON.stringify({completed:box.checked})});refresh()};li.append(box,text);return li;})); if(!list.children.length)list.innerHTML="<li>Clear day. Add what matters next.</li>"; }
    document.querySelector("#add").onsubmit=async e=>{e.preventDefault();const title=new FormData(e.target).get("title");await call("/tasks",{method:"POST",body:JSON.stringify({title,due_date:today,category:"Personal",priority:"medium"})});e.target.reset();refresh();};
    if("serviceWorker" in navigator) navigator.serviceWorker.register("/mobile/service-worker.js"); refresh();
  </script>
</body>
</html>
